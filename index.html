<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>好奇號自然教室</title>
<meta name="description" content="給國小學生的互動自然科學網站，動手玩、看得見的科學知識。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #F1F5F9; --surface: #FFFFFF; --surface-2: #E4ECF4; --ink: #1A2740; --ink-soft: #4B5C78; --line: #C8D5E3;
  --sun: #F2A51A; --ocean: #2F7FC1;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E1626; --surface: #172238; --surface-2: #213050; --ink: #E7EEF8; --ink-soft: #A8B7CF; --line: #2E3F60; --sun: #F6B739; --ocean: #3F8FD2; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0E1626; --surface: #172238; --surface-2: #213050; --ink: #E7EEF8; --ink-soft: #A8B7CF; --line: #2E3F60; --sun: #F6B739; --ocean: #3F8FD2; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.75; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px; display: grid; gap: 28px; }
h1, h2 { font-family: var(--font-display); line-height: 1.3; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); }
p { margin: 0; max-width: 40em; }
.lead { color: var(--ink-soft); font-size: 1.2rem; }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 8px; align-content: start; color: inherit; text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--sun); outline: none; }
.card h2 { font-size: 1.45rem; }
.card .meta { font-size: .85rem; color: var(--ink-soft); }
.card.soon { background: var(--surface-2); border-style: dashed; }
.badge { justify-self: start; font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--sun); color: #1A2740; }
.card.soon .badge { background: var(--line); color: var(--ink); }
.art { width: 100%; height: auto; border-radius: 10px; background: #101B33; }
footer { color: var(--ink-soft); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:12px">
    <h1>好奇號自然教室</h1>
    <p class="lead">給國小小朋友的互動科學網站。每個主題都可以動手拖拉、按按看，用眼睛看懂大自然的道理。</p>
  </header>

  <div class="cards">
    <a class="card" href="topics/four-seasons.html">
      <svg class="art" viewBox="0 0 240 120" aria-hidden="true">
        <ellipse cx="120" cy="60" rx="96" ry="38" fill="none" stroke="#8FA6CC" stroke-dasharray="4 5"/>
        <circle cx="120" cy="60" r="20" fill="#FFC23A"/>
        <g transform="translate(24 60) rotate(23.4)"><circle r="11" fill="#2F7FC1"/><line y1="-18" y2="18" stroke="#fff" stroke-width="2"/></g>
        <g transform="translate(216 60) rotate(23.4)"><circle r="11" fill="#2F7FC1"/><line y1="-18" y2="18" stroke="#fff" stroke-width="2"/></g>
      </svg>
      <span class="badge">可以玩了</span>
      <h2>為什麼會有春夏秋冬？</h2>
      <p>拖拉地球繞太陽，找出四季的祕密，再認識熱帶、副熱帶、溫帶和極區。</p>
      <span class="meta">地球與太空 · 約 30 分鐘</span>
    </a>
    <div class="card soon">
      <span class="badge">準備中</span>
      <h2>月亮為什麼會變形？</h2>
      <p>從新月到滿月，看看月亮、地球和太陽的位置。</p>
    </div>
    <div class="card soon">
      <span class="badge">準備中</span>
      <h2>白天和黑夜</h2>
      <p>地球自轉一圈要多久？為什麼地球另一邊是晚上？</p>
    </div>
    <div class="card soon">
      <span class="badge">準備中</span>
      <h2>水的旅行</h2>
      <p>蒸發、凝結、下雨，跟著一滴水環遊地球。</p>
    </div>
  </div>

  <footer>好奇號自然教室 · 內容以國小自然科學課程為基礎，採用簡化的說明方式。</footer>
</div>
</body>
</html>
